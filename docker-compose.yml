services:
  postgis:
    image: postgis/postgis:14-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ogc_lab
      POSTGRES_USER: ogc_lab
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请在根目录 .env 中设置 POSTGRES_PASSWORD}"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/create_schema.sql:/docker-entrypoint-initdb.d/01-create-schema.sql:ro
    ports:
      - "127.0.0.1:15434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ogc-lab-network

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.2
    restart: unless-stopped
    environment:
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    volumes:
      - geoserver_data:/opt/geoserver_data
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - ogc-lab-network

volumes:
  postgis_data:
  geoserver_data:

networks:
  ogc-lab-network:
    driver: bridge
